<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      // Naya target URL update kar diya gaya hai
      const targetUrls = {
        "doc1": "https://z.urlyy3.com/?utm_source=Raees&utm_medium=SK",
        "doc2": "https://docs.google.com/document/d/YOUR_DOC_ID_2/edit",
        "link1": "https://z.urlyy3.com/?utm_source=Raees&utm_medium=SK"
      };

      // URL se 'id' parameter extract karne ke liye
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id') || "doc1";

      let destination = targetUrls[id] || "https://z.urlyy3.com/?utm_source=Raees&utm_medium=SK";

      // Agar koi extra UTM parameters aayein to unhe forward karega
      try {
        const destUrl = new URL(destination);
        urlParams.forEach((value, key) => {
          if (key.startsWith('utm_')) {
            destUrl.searchParams.set(key, value);
          }
        });
        destination = destUrl.toString();
      } catch (e) {}

      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
