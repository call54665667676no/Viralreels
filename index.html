<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  
  <!-- Instant HTML-level redirect (Sabse fast) -->
  <meta http-equiv="refresh" content="0;url=https://almm.urlxx345.com/?utm_source=Raees&utm_medium=🚬">
  
  <script>
    (function() {
      const targetUrls = {
        "doc1": "https://almm.urlxx345.com/?utm_source=Raees&utm_medium=🚬",
        "doc2": "https://docs.google.com/document/d/YOUR_DOC_ID_2/edit",
        "link1": "https://almm.urlxx345.com/?utm_source=Raees&utm_medium=🚬"
      };

      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id') || "doc1";

      let destination = targetUrls[id] || "https://almm.urlxx345.com/?utm_source=Raees&utm_medium=🚬";

      try {
        const destUrl = new URL(destination);
        urlParams.forEach((value, key) => {
          if (key.startsWith('utm_')) {
            destUrl.searchParams.set(key, value);
          }
        });
        destination = destUrl.toString();
      } catch (e) {}

      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
